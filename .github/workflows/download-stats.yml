# Records the total release downloads once a day on the "stats" branch,
# with a chart (downloads.svg) that the README shows.
name: Download stats

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
      - name: Check out the stats branch
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${{ github.repository }}" stats; then
            git clone --branch stats --single-branch "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" stats
          else
            mkdir stats && cd stats && git init -b stats
            git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          fi
      - name: Record downloads
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 main/scripts/download_stats.py "${{ github.repository }}" stats
      - name: Push
        working-directory: stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads.csv downloads.svg
          git diff --cached --quiet && exit 0
          git commit -m "stats: downloads on $(date -u +%F)"
          git push origin stats
